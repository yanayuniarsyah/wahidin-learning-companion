<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Akses WLC Tamu</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font:16px system-ui,sans-serif}.card{max-width:720px;margin:7vh auto;background:#fff;padding:2rem;border-radius:18px;box-shadow:0 12px 35px #0f172a18}h1{margin-top:0;color:#1d4ed8}label{display:block;margin:.9rem 0 .35rem;font-weight:650}input,select,textarea{width:100%;padding:.8rem;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{padding:.8rem 1.2rem;border:0;border-radius:9px;background:#2563eb;color:white;font:inherit;font-weight:700;cursor:pointer;margin-top:1rem}button:disabled{opacity:.6}#guestForm,#teacherForm{display:none}.component{padding:1rem 0;border-bottom:1px solid #e2e8f0}.error{color:#b91c1c;margin-top:1rem}.success{color:#047857;margin-top:1rem}
  </style>
</head>
<body><main class="card"><h1>WLC — Akses Tamu</h1><p id="intro">Masukkan kode akses yang diberikan oleh admin.</p>
  <form id="codeForm"><label for="accessCode">Kode Akses</label><input id="accessCode" autocomplete="one-time-code" maxlength="10" required><button>Masuk</button><div id="codeError" class="error"></div></form>
  <form id="teacherForm"><h2 id="schoolTitle">Refleksi Guru</h2><label for="teacherName">Nama Guru</label><input id="teacherName" maxlength="160" required><label for="studentSelect">Nama Siswa</label><select id="studentSelect" required></select><div id="rubric"></div><label for="teacherNote">Catatan</label><textarea id="teacherNote" rows="4" maxlength="4000"></textarea><button id="submitReflection">Kirim Refleksi</button><div id="formMessage"></div></form>
  </main>
<script>
const API=(location.hostname==='localhost'||location.hostname==='127.0.0.1')?'/api.php/api':'/api'; let guestToken=''; let components=[];
const codeForm=document.getElementById('codeForm');
codeForm.addEventListener('submit', async event=>{event.preventDefault();const message=document.getElementById('codeError');message.textContent='';try{const response=await fetch(`${API}/auth-token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('accessCode').value.trim()})});const data=await response.json();if(!response.ok)throw Error(data.error||'Kode tidak valid');guestToken=data.token;localStorage.setItem('wlc_student_token',guestToken);if(data.role==='siswa'){location.href='student.html';return;}if(data.role!=='guru_tamu')throw Error('Role akses tidak dikenali');await showTeacher(data.school.nama);}catch(error){message.textContent=error.message;}});
async function showTeacher(schoolName){document.getElementById('intro').textContent='Akses sekolah: '+schoolName;document.getElementById('schoolTitle').textContent='Refleksi Guru — '+schoolName;const form=document.getElementById('teacherForm');const headers={'Authorization':'Bearer '+guestToken};const [studentsResponse,rubricResponse]=await Promise.all([fetch(`${API}/guest/students`,{headers}),fetch(`${API}/reflection/components?type=guru_tamu`)]);if(!studentsResponse.ok||!rubricResponse.ok)throw Error('Data sekolah/rubrik gagal dimuat');const students=await studentsResponse.json();components=await rubricResponse.json();const select=document.getElementById('studentSelect');select.replaceChildren(new Option('Pilih siswa',''));students.forEach(student=>select.add(new Option(student.nama,student.id)));const root=document.getElementById('rubric');root.replaceChildren();components.forEach(component=>{let options=component.options;if(typeof options==='string')options=JSON.parse(options);const row=document.createElement('div');row.className='component';const label=document.createElement('label');label.textContent=component.name;const select=document.createElement('select');select.dataset.key=component.key;select.required=true;select.add(new Option('Pilih nilai',''));Object.entries(options||{}).forEach(([value,name])=>select.add(new Option(name,value)));row.append(label,select);root.append(row);});codeForm.style.display='none';form.style.display='block';}
document.getElementById('teacherForm').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('submitReflection'),message=document.getElementById('formMessage');button.disabled=true;message.textContent='';const scores={};document.querySelectorAll('#rubric select').forEach(select=>scores[select.dataset.key]=select.value);try{const response=await fetch(`${API}/guest/reflection`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+guestToken},body:JSON.stringify({teacher_name:document.getElementById('teacherName').value.trim(),siswaId:Number(document.getElementById('studentSelect').value),catatan:document.getElementById('teacherNote').value,scores})});const data=await response.json();if(!response.ok)throw Error(data.error||'Gagal menyimpan');message.className='success';message.textContent='Refleksi berhasil dikirim.';event.target.reset();}catch(error){message.className='error';message.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
