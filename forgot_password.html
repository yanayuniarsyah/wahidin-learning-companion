<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Lupa Password – WLC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #D1B073;
      --bg: #0B0C10;
      --surface: #15161A;
      --text: #F8F9FA;
      --border: rgba(209, 176, 115, 0.15);
    }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: var(--surface); padding: 2.5rem; border-radius: 1rem; width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; margin-bottom: 1.5rem; color: var(--primary); }
    .form-group { margin-bottom: 1.5rem; text-align: left; position: relative; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #ccc; }
    input { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 0.5rem; background: #1e1e1e; color: #fff; font-family: inherit; font-size: 1rem; box-sizing: border-box; }
    input:focus { outline: none; border-color: var(--primary); }
    .btn { background: var(--primary); color: #000; border: none; padding: 0.8rem; width: 100%; border-radius: 0.5rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-bottom: 1rem; font-family: inherit; }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn:not(:disabled):hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(209, 176, 115, 0.3); }
    .link { color: var(--primary); text-decoration: none; font-size: 0.9rem; transition: 0.2s; }
    .link:hover { text-decoration: underline; }
    .eye-icon { position: absolute; right: 1rem; top: 2.3rem; cursor: pointer; color: #888; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card" id="step1">
    <h2>Lupa Password</h2>
    <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 2rem;">Masukkan email yang terdaftar untuk menerima kode OTP.</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="resetEmail" placeholder="nama@email.com" />
    </div>
    <button class="btn" id="btnRequest" onclick="requestOtp()">Kirim Kode OTP</button>
    <a href="index.html" class="link"><i class="fas fa-arrow-left"></i> Kembali ke Login</a>
  </div>

  <div class="card hidden" id="step2">
    <h2>Reset Password</h2>
    <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 2rem;">Masukkan kode OTP yang telah dikirim ke email Anda.</p>
    <div class="form-group">
      <label>Kode OTP (6 Digit)</label>
      <input type="text" id="resetOtp" placeholder="123456" maxlength="6" style="text-align:center; letter-spacing:3px; font-size:1.2rem; font-weight:bold;" />
    </div>
    <div class="form-group">
      <label>Password Baru</label>
      <input type="password" id="resetPassword" placeholder="Minimal 8 karakter" style="padding-right: 2.5rem;" />
      <i class="fas fa-eye eye-icon" onclick="togglePwd()"></i>
    </div>
    <button class="btn" id="btnVerify" onclick="verifyOtp()">Simpan Password Baru</button>
    <a href="javascript:void(0)" onclick="goBackToStep1()" class="link"><i class="fas fa-arrow-left"></i> Ganti Email</a>
  </div>

  <script>
    function togglePwd() {
      const pwd = document.getElementById('resetPassword');
      const icon = document.querySelector('.eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function showToast(message, isError = false) {
      const toast = document.createElement('div');
      toast.style.position = 'fixed';
      toast.style.bottom = '20px';
      toast.style.left = '50%';
      toast.style.transform = 'translateX(-50%) translateY(100px)';
      toast.style.background = isError ? '#e74c3c' : 'var(--primary)';
      toast.style.color = isError ? '#fff' : '#000';
      toast.style.padding = '12px 24px';
      toast.style.borderRadius = '30px';
      toast.style.fontWeight = '600';
      toast.style.boxShadow = '0 5px 15px rgba(0,0,0,0.3)';
      toast.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
      toast.style.zIndex = '9999';
      toast.textContent = message;
      document.body.appendChild(toast);
      
      setTimeout(() => { toast.style.transform = 'translateX(-50%) translateY(0)'; }, 50);
      setTimeout(() => {
        toast.style.transform = 'translateX(-50%) translateY(100px)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function goBackToStep1() {
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step1').classList.remove('hidden');
    }

    async function requestOtp() {
      const email = document.getElementById('resetEmail').value.trim();
      if (!email) return showToast('Mohon masukkan email.', true);

      const btn = document.getElementById('btnRequest');
      const oldText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/request-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        
        if (res.ok) {
          showToast(data.message || 'OTP berhasil dikirim.');
          document.getElementById('step1').classList.add('hidden');
          document.getElementById('step2').classList.remove('hidden');
        } else {
          showToast(data.error || 'Terjadi kesalahan.', true);
        }
      } catch (err) {
        showToast('Terjadi kesalahan jaringan.', true);
      } finally {
        btn.innerHTML = oldText;
        btn.disabled = false;
      }
    }

    async function verifyOtp() {
      const email = document.getElementById('resetEmail').value.trim();
      const otp = document.getElementById('resetOtp').value.trim();
      const new_password = document.getElementById('resetPassword').value.trim();
      
      if (!otp || !new_password) return showToast('Mohon lengkapi OTP dan password baru.', true);
      if (new_password.length < 8) return showToast('Password baru minimal 8 karakter.', true);

      const btn = document.getElementById('btnVerify');
      const oldText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/reset-with-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp, new_password })
        });
        const data = await res.json();
        
        if (res.ok) {
          showToast('Password berhasil direset! Silakan login.');
          setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        } else {
          showToast(data.error || 'Gagal mereset password.', true);
        }
      } catch (err) {
        showToast('Terjadi kesalahan jaringan.', true);
      } finally {
        btn.innerHTML = oldText;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
