<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Lupa Password – WLC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #D1B073;
      --bg: #0B0C10;
      --surface: #15161A;
      --text: #F8F9FA;
      --border: rgba(209, 176, 115, 0.15);
    }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: var(--surface); padding: 2.5rem; border-radius: 1rem; width: 100%; max-width: 400px; text-align: center; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; margin-bottom: 1.5rem; color: var(--primary); }
    .form-group { margin-bottom: 1.5rem; text-align: left; position: relative; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: #ccc; }
    input { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 0.5rem; background: #1e1e1e; color: #fff; font-family: inherit; font-size: 1rem; box-sizing: border-box; }
    input:focus { outline: none; border-color: var(--primary); }
    .btn { background: var(--primary); color: #000; border: none; padding: 0.8rem; width: 100%; border-radius: 0.5rem; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-bottom: 1rem; font-family: inherit; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(209, 176, 115, 0.3); }
    .link { color: var(--primary); text-decoration: none; font-size: 0.9rem; transition: 0.2s; }
    .link:hover { text-decoration: underline; }
    .eye-icon { position: absolute; right: 1rem; top: 2.3rem; cursor: pointer; color: #888; }
  </style>
</head>
<body>
  <div class="card" id="step1">
    <h2>Lupa Password</h2>
    <p style="font-size: 0.9rem; color: #aaa; margin-bottom: 2rem;">Masukkan username Anda untuk mereset password. Sistem akan mengubah password Anda saat ini ke password baru.</p>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="resetUsername" placeholder="Masukkan username" />
    </div>
    <div class="form-group">
      <label>Password Baru</label>
      <input type="password" id="resetPassword" placeholder="Masukkan password baru" style="padding-right: 2.5rem;" />
      <i class="fas fa-eye eye-icon" onclick="togglePwd()"></i>
    </div>
    <button class="btn" onclick="doReset()">Reset Password</button>
    <a href="index.html" class="link"><i class="fas fa-arrow-left"></i> Kembali ke Login</a>
  </div>

  <script>
    function togglePwd() {
      const pwd = document.getElementById('resetPassword');
      const icon = document.querySelector('.eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    async function doReset() {
      const username = document.getElementById('resetUsername').value.trim();
      const new_password = document.getElementById('resetPassword').value.trim();
      if (!username || !new_password) return alert('Mohon lengkapi username dan password baru.');

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, new_password })
        });
        const data = await res.json();
        if (data.success) {
          alert('Password berhasil direset! Silakan login dengan password baru.');
          window.location.href = 'index.html';
        } else {
          alert(data.error || 'Gagal mereset password.');
        }
      } catch (err) {
        alert('Terjadi kesalahan jaringan.');
      }
    }
  </script>
</body>
</html>
